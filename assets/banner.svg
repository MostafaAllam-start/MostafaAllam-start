<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Mostafa Allam, Full-Stack Software Engineer</title>
  <desc id="desc">Software Engineer at CTC MENA in Alexandria, Egypt, building enterprise web platforms with React, TypeScript and ASP.NET Core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F1830"/></linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.05" r="0.55"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.32"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="1" r="0.5"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.30"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" x2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="fadeMask" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gridFade"><rect width="1280" height="380" fill="url(#fadeMask)"/></mask>
    <clipPath id="card"><rect width="1280" height="380" rx="20"/></clipPath>
    <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect width="1280" height="380" fill="url(#grid)" mask="url(#gridFade)"/>
    <rect width="1280" height="380" fill="url(#glowA)"/>
    <rect width="1280" height="380" fill="url(#glowB)"/>
    <rect width="1280" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="379" rx="19.5" fill="none" stroke="#1F2A44"/>

  <!-- identity -->
  <g>
    <rect x="64" y="58" width="336" height="36" rx="18" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.45"/>
    <circle cx="86" cy="76" r="4.5" fill="#60A5FA"/>
    <text x="102" y="81" class="mono" font-size="14" letter-spacing="1.6" fill="#93C5FD">SOFTWARE ENGINEER · CTC MENA</text>

    <text x="61" y="170" class="sans" font-size="72" font-weight="700" fill="#F0F6FC" letter-spacing="-1">Mostafa Allam</text>
    <text x="64" y="218" class="sans" font-size="31" font-weight="600" fill="url(#titleGrad)">Full-Stack Software Engineer</text>
    <text x="64" y="262" class="sans" font-size="21" fill="#9FB0C8">Enterprise web platforms with React, TypeScript and ASP.NET Core</text>

    <g transform="translate(64 298)">
      <path d="M8 0C3.6 0 0 3.5 0 7.9 0 13.8 8 22 8 22s8-8.2 8-14.1C16 3.5 12.4 0 8 0zm0 10.8a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="#60A5FA"/>
      <text x="28" y="17" class="sans" font-size="19" fill="#C9D1D9">Alexandria, Egypt</text>
      <circle cx="244" cy="11" r="5.5" fill="#22C55E"/>
      <circle cx="244" cy="11" r="5" fill="none" stroke="#22C55E" stroke-width="2">
        <animate attributeName="r" values="5;11" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="262" y="17" class="sans" font-size="19" fill="#C9D1D9">Open to collaboration</text>
    </g>
  </g>

  <!-- code window -->
  <g>
    <rect x="744" y="58" width="476" height="264" rx="14" fill="#0D1526" fill-opacity="0.92" stroke="#22304D"/>
    <path d="M744 98H1220" stroke="#22304D"/>
    <circle cx="768" cy="78" r="6" fill="#FF5F57"/>
    <circle cx="788" cy="78" r="6" fill="#FEBC2E"/>
    <circle cx="808" cy="78" r="6" fill="#28C840"/>
    <text x="982" y="83" text-anchor="middle" class="mono" font-size="14" fill="#6B7A90">engineer.ts</text>
    
    <g>
      <text x="766" y="138" class="mono" font-size="13.5" fill="#3B4A66">1</text>
      <text x="794" y="138" class="mono" font-size="16.5" xml:space="preserve"><tspan fill="#C792EA">const</tspan><tspan fill="#82AAFF"> engineer</tspan><tspan fill="#C9D1D9"> = {</tspan></text>
    </g>
    <g>
      <text x="766" y="165" class="mono" font-size="13.5" fill="#3B4A66">2</text>
      <text x="794" y="165" class="mono" font-size="16.5" xml:space="preserve"><tspan fill="#E6EDF3">  name</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">&quot;Mostafa Allam&quot;</tspan><tspan fill="#C9D1D9">,</tspan></text>
    </g>
    <g>
      <text x="766" y="192" class="mono" font-size="13.5" fill="#3B4A66">3</text>
      <text x="794" y="192" class="mono" font-size="16.5" xml:space="preserve"><tspan fill="#E6EDF3">  role</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">&quot;Full-Stack Engineer&quot;</tspan><tspan fill="#C9D1D9">,</tspan></text>
    </g>
    <g>
      <text x="766" y="219" class="mono" font-size="13.5" fill="#3B4A66">4</text>
      <text x="794" y="219" class="mono" font-size="16.5" xml:space="preserve"><tspan fill="#E6EDF3">  frontend</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C9D1D9">[</tspan><tspan fill="#C3E88D">&quot;React&quot;</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#C3E88D">&quot;TypeScript&quot;</tspan><tspan fill="#C9D1D9">],</tspan></text>
    </g>
    <g>
      <text x="766" y="246" class="mono" font-size="13.5" fill="#3B4A66">5</text>
      <text x="794" y="246" class="mono" font-size="16.5" xml:space="preserve"><tspan fill="#E6EDF3">  backend</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C9D1D9">[</tspan><tspan fill="#C3E88D">&quot;ASP.NET Core&quot;</tspan><tspan fill="#C9D1D9">, </tspan><tspan fill="#C3E88D">&quot;Laravel&quot;</tspan><tspan fill="#C9D1D9">],</tspan></text>
    </g>
    <g>
      <text x="766" y="273" class="mono" font-size="13.5" fill="#3B4A66">6</text>
      <text x="794" y="273" class="mono" font-size="16.5" xml:space="preserve"><tspan fill="#E6EDF3">  basedIn</tspan><tspan fill="#89DDFF">: </tspan><tspan fill="#C3E88D">&quot;Alexandria, EG&quot;</tspan><tspan fill="#C9D1D9">,</tspan></text>
    </g>
    <g>
      <text x="766" y="300" class="mono" font-size="13.5" fill="#3B4A66">7</text>
      <text x="794" y="300" class="mono" font-size="16.5" xml:space="preserve"><tspan fill="#C9D1D9">};</tspan></text>
    </g>
    <rect x="818.8" y="284" width="10" height="20" rx="1" fill="#60A5FA">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
