<svg xmlns="http://www.w3.org/2000/svg" width="560" height="268" viewBox="0 0 560 268" role="img" aria-labelledby="title desc">
  <title id="title">BPM Studio</title>
  <desc id="desc">A visual BPMN process modeler paired with a drag-and-drop form builder, with authentication and a multilingual interface. Built with React 19, TypeScript, React Flow, Zustand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F1830"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.75"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.20"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="560" height="268" rx="16"/></clipPath>
    <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="560" height="268" fill="url(#bg)"/>
    <rect width="560" height="268" fill="url(#glow)"/>
    <rect width="560" height="3" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="559" height="267" rx="15.5" fill="none" stroke="#1F2A44"/>

  <rect x="32" y="32" width="52" height="52" rx="12" fill="#3B82F6" fill-opacity="0.16" stroke="#3B82F6" stroke-opacity="0.55"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="43" cy="58" r="4.5"/><rect x="51.5" y="52.5" width="13" height="11" rx="2.5"/><circle cx="73" cy="58" r="4.5"/><path d="M47.5 58h4M64.5 58h4"/></g>

  <text x="102" y="58" class="sans" font-size="27" font-weight="700" fill="#F0F6FC">BPM Studio</text>
  <text x="103" y="81" class="mono" font-size="13.5" letter-spacing="1.4" fill="#93C5FD">PROCESS AUTOMATION</text>
  <g fill="none" stroke="#6B7A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M514 48l14-14M516 34h12v12"/></g>

  <text x="32" y="130" class="sans" font-size="18.5" fill="#9FB0C8">A visual BPMN process modeler paired with a</text>
  <text x="32" y="156" class="sans" font-size="18.5" fill="#9FB0C8">drag-and-drop form builder, with authentication and a</text>
  <text x="32" y="182" class="sans" font-size="18.5" fill="#9FB0C8">multilingual interface.</text>

  <g><rect x="32" y="208" width="95" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="79.5" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">React 19</text></g>
    <g><rect x="135" y="208" width="112" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="191" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">TypeScript</text></g>
    <g><rect x="255" y="208" width="112" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="311" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">React Flow</text></g>
    <g><rect x="375" y="208" width="87" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="418.5" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">Zustand</text></g>
</svg>
