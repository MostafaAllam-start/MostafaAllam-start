  <text x="103" y="81" class="mono" font-size="13.5" letter-spacing="1.4" fill="#FDE047">BUILT FROM SCRATCH</text>
  <g fill="none" stroke="#6B7A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M514 48l14-14M516 34h12v12"/></g>

