    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="560" height="268" rx="16"/></clipPath>
    <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="560" height="268" fill="url(#bg)"/>
    <rect width="560" height="268" fill="url(#glow)"/>
    <rect width="560" height="3" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="559" height="267" rx="15.5" fill="none" stroke="#1F2A44"/>

  <rect x="32" y="32" width="52" height="52" rx="12" fill="#8B5CF6" fill-opacity="0.16" stroke="#8B5CF6" stroke-opacity="0.55"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="41" y="49" width="34" height="19" rx="9.5"/><path d="M47 58.5h7M50.5 55v7"/><circle cx="64" cy="56.5" r="1.6" fill="#fff"/><circle cx="68.5" cy="60.5" r="1.6" fill="#fff"/></g>

  <text x="102" y="58" class="sans" font-size="27" font-weight="700" fill="#F0F6FC">GameHub</text>
  <text x="103" y="81" class="mono" font-size="13.5" letter-spacing="1.4" fill="#C4B5FD">WEB APP · RAWG API</text>
  <g fill="none" stroke="#6B7A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M514 48l14-14M516 34h12v12"/></g>

  <text x="32" y="130" class="sans" font-size="18.5" fill="#9FB0C8">Game discovery on the RAWG API: genre and platform</text>
  <text x="32" y="156" class="sans" font-size="18.5" fill="#9FB0C8">filters, sorting, search, and detail pages with</text>
  <text x="32" y="182" class="sans" font-size="18.5" fill="#9FB0C8">trailers and screenshots.</text>

  <g><rect x="32" y="208" width="70" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="67" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">React</text></g>
    <g><rect x="110" y="208" width="112" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="166" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">TypeScript</text></g>
