<svg xmlns="http://www.w3.org/2000/svg" width="560" height="268" viewBox="0 0 560 268" role="img" aria-labelledby="title desc">
  <title id="title">Ticketing Support</title>
  <desc id="desc">A support-ticket platform with live replies and notifications over a standalone Socket.IO server, shipped as Docker Compose services. Built with Next.js, PostgreSQL, Socket.IO, Docker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F1830"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.75"><stop offset="0" stop-color="#14B8A6" stop-opacity="0.20"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="560" height="268" rx="16"/></clipPath>
    <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="560" height="268" fill="url(#bg)"/>
    <rect width="560" height="268" fill="url(#glow)"/>
    <rect width="560" height="3" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="559" height="267" rx="15.5" fill="none" stroke="#1F2A44"/>

  <rect x="32" y="32" width="52" height="52" rx="12" fill="#14B8A6" fill-opacity="0.16" stroke="#14B8A6" stroke-opacity="0.55"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M44 46h28a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H57l-7 6v-6h-6a4 4 0 0 1-4-4V50a4 4 0 0 1 4-4z"/><path d="M48 54h20M48 60h12"/></g>

  <text x="102" y="58" class="sans" font-size="27" font-weight="700" fill="#F0F6FC">Ticketing Support</text>
  <text x="103" y="81" class="mono" font-size="13.5" letter-spacing="1.4" fill="#5EEAD4">REAL-TIME PLATFORM</text>
  <g fill="none" stroke="#6B7A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M514 48l14-14M516 34h12v12"/></g>

  <text x="32" y="130" class="sans" font-size="18.5" fill="#9FB0C8">A support-ticket platform with live replies and</text>
  <text x="32" y="156" class="sans" font-size="18.5" fill="#9FB0C8">notifications over a standalone Socket.IO server,</text>
  <text x="32" y="182" class="sans" font-size="18.5" fill="#9FB0C8">shipped as Docker Compose services.</text>

  <g><rect x="32" y="208" width="87" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="75.5" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">Next.js</text></g>
    <g><rect x="127" y="208" width="112" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="183" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">PostgreSQL</text></g>
    <g><rect x="247" y="208" width="104" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="299" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">Socket.IO</text></g>
    <g><rect x="359" y="208" width="78" height="32" rx="16" fill="#111A2E" stroke="#22304D"/><text x="398" y="229" text-anchor="middle" class="mono" font-size="14" fill="#C9D1D9">Docker</text></g>
</svg>
